<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <!--
    Tabela e composta de linhas que sao compostas de celulas.
    <tr> Sao linhas (rows)
    <th> Define um cabecalho (header)
    <td> Colocar dados na tabela
    -->
        <h1>Trabalhando com tabelas</h1>
        <table>
            <caption>Tabela de servicos</caption>
            <tr>
            <th>Ordem</th>
            <th>Servico</th>
            <th>Precos</th>
            <th>Status</th>
            </tr>
            
            <tr>
                <td>1</td>
                <td>Troca de vidro</td>
                <td>RS600</td>
                <td>Em andamento</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Limpeza</td>
                <td>150</td>
                <td>Aguardando</td>
            </tr>
        </table>

</body>
</html>
