</head>
<body>

    1- Inline CSS - Direto no html, nao e uma boa pratica
    2- CSS Interno - Dentro da tag <style> no head

    -->

    <h1 class="primeiro-h1">Mais um h1</h1>

        <h2 class="primeiro-h1">Segundaaa</h2>
