<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css"/>
    <title>Faça seu cadastro</title>
</head>
<body>
    <div id="wrapper">
        <!-- Área container -->
        <div id="container-signup">
            <!-- Área direita -->
            <div class="column">
                <div class="login-panel">
                    <div class="logo">
                        <img class="logo-img" src="assets/logo.png" alt="Instagram Logo"/>
                    </div>
                    <div class="message">
                        <span>Cadastre-se para ver fotos</span>
                    </div>
                    <button class="cta-button">Entrar no Facebook</button>

                    <div class="divisor-container">
                        <div class="line"></div>
                        <div class="divisor-tag">ou</div>
                        <div class="line"></div>
                    </div>
                    
                    <form>
                        <input placeholder="Telefone ou email" type="text" name="email"/>
                        <input placeholder="Nome completo" type="text" name="name"/>
                        <input placeholder="Nome de usuário" type="text" name="username"/>
                        <input placeholder="Senha" type="password" name="password"/>
                        <input type="submit" value="Entrar"/>
                    </form>
                </div>

                <div class="infobox">
                    <p>Possui uma conta? <a href="index.html">Conecte-se</a></p>
                </div>

                <div class="get-app-panel">
                    Obtenha o app.
                    <div class="app-buttons">
                        <a href="#">
                            <img src="assets/appstore.png" alt="App Store"/>
                        </a>
                        <a href="#">
                            <img src="assets/googleplay.png" alt="Play Store"/>
                        </a>
                    </div>
                </div>
            </div>
            <!-- Fim área direita -->
        </div>
        <!-- Fim área container -->

        <!-- Footer -->
        <footer>
            <div class="footer-inner">
                <a href="#">About Us</a>
                <a href="#">Support</a>
                <a href="#">Blog</a>
                <a href="#">Press</a>
                <a href="#">API</a>
                <a href="#">Jobs</a>
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
                <a href="#">Directory</a>
                <a href="#">Profile</a>
                <a href="#">Hashtags</a>
                <a href="#">Languages</a>
            </div>
        </footer>
    </div>
</body>
</html>
