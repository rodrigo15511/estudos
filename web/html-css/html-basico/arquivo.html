<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML</title>
</head>
<body>
    <!-- Headings-->
    <h1>Titulo</h1>
    <h2>Outro titulo</h2>
    <h3>Mais um titulo</h3>
    <!--Paragrafos-->
    <p>Paragrafo</p>
    <!--Link-->
    <div>
        <a href="https://www.youtube.com/">Youtube </a>
    </div>
    <div>
        <a href="https://www.youtube.com/" target="_blank">Youtube outra pagina</a>
    </div>
    <!--Listas-->
    <ol>
        <li>primeiro faz isso</li>
        <li>depois aquilo</li>
        <li>enfim aquilo</li>
    </ol>
    <ul>
        <li>1 Item</li>
        <li>2 Item</li>
    </ul>
    <!--Imagem-->
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQHu75r08o3gsV-o-V8_UgFf01q8ggiTPEIVg&s" 
    alt="VASCO"
    />
    <!--Texto em negrito-->
    <p><b>Negrito</b></p>
    <!--Texto em italico-->
    <p>
        Paragrafo com
        <i>Italico</i>
    </p>
    <p>
        Paragrafo com
        <em>Italico</em>
    </p>
    <div>
    </div>
</body>
</html>
